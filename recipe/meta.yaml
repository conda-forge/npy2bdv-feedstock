{% set name = "npy2bdv" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/npy2bdv-{{ version }}.tar.gz
  sha256: c7333b44c0ed360781639b090c6c039b56dbe9d6db4c33e8964c0a184839cda1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - h5py
    - numpy
    - scikit-image
    - tqdm

test:
  imports:
    - npy2bdv
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/nvladimus/npy2bdv
  summary: Package for writing/reading 3d numpy arrays to/from HDF5 files (for Fiji/BigDataViewer/BigStitcher).
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - multimeric
